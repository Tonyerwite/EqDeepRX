[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqdeeprx-reproduction"
version = "0.1.0"
description = "Paper-aligned PyTorch reproduction of the EqDeepRx receiver up to uncoded BER."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.6",
  "matplotlib>=3.10.8",
  "torch>=2.9.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
standard = ["sionna==2.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["eqdeeprx_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
